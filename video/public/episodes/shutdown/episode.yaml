# Episode spec: maps script beats -> scenes/components/assets.
# Consumed by the Remotion composition; timings come from vo/words.json once
# VO exists (each beat starts at the start of its first narration line).
# Durations below are pre-VO estimates in seconds.
#
# RETRO episode (the fall-2025 shutdown, scored after the fact).
#
# DATA NOTE: "The Tape" recovered from the Kalshi /historical store — the
# settled market KXGOVSHUTLENGTH-26JAN01-40D ("More than 40 days"), a 39-day
# daily tape (Oct 4 -> Nov 11 2025: opens ~11%, Nov 5 = 72.5%, Nov 6 jumps
# +18 to 90.5%, ends ~99%). This cut still leans on the NEW grammar — stat
# slams, headline cards, a compare-bars "who called it" beat and memes — with
# one live chart moment ([beat:the-bet] insert). No prices were invented; the
# chart stays well under the 35% chart cap. Room to add explicit
# [beat:the-tape]/[beat:zoom] MarketChartScene beats later if desired.

slug: shutdown
title: "The market says: it lasted 43 days — and the crowd called it"
format: { width: 1920, height: 1080, fps: 30 }
data: data.json          # KXGOVSHUTLENGTH-26JAN01-40D tape via /historical
vo: vo/words.json        # exported by scripts/vo_make_timeline.py
music: null              # TODO: Epidemic Sound bed, drop in public/assets/music/
scenes:
  - beat: cold-open
    scene: BigNumber                  # the hook number (no chart tape available)
    est: 12
    props:
      value: 43
      suffix: " DAYS"
      label: "THE GOVERNMENT STAYED SHUT"
      sub: "OCT 1 – NOV 12 2025 · LONGEST IN U.S. HISTORY"
      kicker: "RESOLUTION WATCH · RETRO"
      sfx: alarm
      size: 240

  - beat: title
    scene: KineticTitle
    est: 3
    props: { words: ["THE", "MARKET", "SAYS"], accent: magenta, kicker: "ep 03 · retro" }

  - beat: setup
    scene: HeadlineCard               # the standoff, in one real card
    est: 26
    props:
      src: assets/headlines/shutdown-npr-h1.png   # tight headline crop
      aspect: 8.04
      source: NPR
      date: "NOV 13 2025"
      headline: "Longest government shutdown in U.S. history ends after 43 days"
      tilt: -1.5
    overlays:
      - { type: statCard, text: "THE BILL FAILED 14 TIMES", at: 6 }
      - { type: statCard, text: "FIGHT: EXPIRING ACA SUBSIDIES", at: 12 }

  - beat: the-bet
    scene: CompareBars                # the spine: who called it
    est: 20
    props:
      title: "WHO CALLED IT"
      unit: "PREDICTED SHUTDOWN LENGTH"
      max: 43
      rows:
        - { label: "KALSHI (THE MARKET)", value: 43, display: "40+ DAYS", slot: 0 }
        - { label: "DC / CABLE CONSENSUS", value: 6,  display: "'DAYS AWAY'", slot: 1 }
    overlays:
      - type: HeadlineCard
        at: 11
        props:
          src: assets/headlines/shutdown-market-fox-h1.png   # tight headline crop
          aspect: 4.59
          source: FOX BUSINESS
          date: "OCT 6 2025"
          headline: "Hopes dim in prediction markets as traders bet government shutdown will drag on for weeks"
          width: 980
          tilt: 2
    inserts:
      # The tape (data.json/markets[]) is now populated — insert lights up.
      - { type: MarketChartScene, at: 4, dur: 5,
          props: { annotationsThrough: record, revealUntil: "2025-11-06", showCursor: true, showCounter: true } }

  - beat: move-begins
    scene: BigNumber                  # the human stakes on day one
    est: 12
    props:
      value: 42
      suffix: "M"
      label: "AMERICANS WARNED THEIR FOOD AID COULD STOP"
      sub: "SNAP · SHUTDOWN DAY ONE"
      kicker: "OCT 1 2025"
      sfx: alarm
    overlays:
      - { type: propPop, asset: gavel, at: 0.5 }

  - beat: move-record
    scene: HeadlineCard               # Nov 5 — the record breaks
    est: 12
    props:
      src: assets/headlines/shutdown-record-axios-h1.png   # tight headline crop
      aspect: 4.55
      source: AXIOS
      date: "NOV 5 2025"
      headline: "Trump breaks record for longest government shutdown in history"
    note: "day 35 — surprised the networks, not the order book"

  - beat: meme-react
    scene: MemeCutaway
    est: 3
    props:
      meme_intent: "this is fine — furloughed, sitting in the flames"
      asset: this-is-fine
      caption: "DAY 35 OF 'DAYS AWAY'"

  - beat: move-ends
    scene: BigNumber                  # bookend: the payoff number returns
    est: 12
    props:
      value: 43
      suffix: " DAYS"
      label: "FINAL COUNT — THE MARKET'S NUMBER"
      sub: "SENATE 60–40 NOV 9 · SIGNED NOV 12 2025"
      kicker: "REOPENED"
      accent: gold
      sfx: ka-ching
      size: 240

  - beat: so-what
    scene: MemeCutaway                # the crowd is still betting
    est: 16
    props:
      meme_intent: "smug / vindicated — the market was right, and it's still open"
      asset: mascot-smug
      caption: "OPEN NOW: 'GOVT SHUTDOWN IN 2026?'"
      credit: "KXSHUTDOWNBY-26DEC31 · KALSHI"

  - beat: endcard
    scene: EndCard
    est: 12
    props:
      title: RESOLUTION WATCH
      entries:
        - { market: "GOVT SHUTDOWN 2025", call: "market called 40+ days", status: YES }
        - { market: "GOVT SHUTDOWN IN 2026", call: "open — go check", status: OPEN }
        - { market: "OPENAI DECLARES AGI BY 2027", call: "covered @ 5%", status: OPEN }

intro_cam:              # optional human cold-open (Sam on camera) — slots before cold-open
  enabled: false
  src: null             # drop a clip at public/episodes/shutdown/intro.mp4 and set enabled
  lower_third: "SAM — was not furloughed"
captions: { style: word-pop, page_words: 4 }
