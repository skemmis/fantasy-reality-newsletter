[project]
name = "fr-newsletter"
version = "0.1.0"
description = "Fantasy Reality newsletter toolkit: prediction-market trend finding, data viz, and outline drafting"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.1",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fr_newsletter*", "app*"]

[tool.setuptools.package-data]
fr_newsletter = ["assets/fonts/*.ttf", "assets/fonts/*.txt", "assets/sprites/*.png", "assets/*.md"]
app = ["templates/*.html"]
